; ============================================================================
;  Algae Air Purifier — PlatformIO project file
;  Board: ESP32-S3 (generic DevKitC-1, 44-pin, no PSRAM assumed)
;  If your board has an N16R8 / N8R8 module, board_build.arduino.memory_type
;  below is not required, but it won't hurt to leave it out.
; ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0        ; pinned for Arduino core 2.0.17 (stable LEDC/WebServer API)
board = esp32-s3-devkitc-1
framework = arduino
lib_compat_mode = strict
lib_ldf_mode = chain

monitor_speed = 115200
upload_speed = 921600

; LittleFS is used to store /data (the website: index.html, style.css, script.js)
board_build.filesystem = littlefs

; Give the app a bit more room; default partition table is fine for this project,
; but if you later add OTA, switch to a partitions table with two OTA slots.
; board_build.partitions = default.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/Adafruit TCS34725 @ ^1.4.4
    adafruit/Adafruit BusIO @ ^1.16.1
    claws/BH1750 @ ^1.3.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    esp32async/ESPAsyncWebServer @ 3.6.0
    esp32async/AsyncTCP @ 3.3.2

build_flags =
    -DCORE_DEBUG_LEVEL=1
